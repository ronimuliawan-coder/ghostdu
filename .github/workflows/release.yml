name: Release

# Tagged pushes (v0.1.0, v0.2.0, ...) build the release binary on x86_64 and
# aarch64 (GitHub's free linux/arm64 hosted runner), bundle each with the man
# page and shell completions generated by the binary itself, and publish
# everything as a GitHub Release. `packaging/ghostdu-bin/PKGBUILD` downloads
# the x86_64 tarball assembled here, so keep its file list in sync.
#
# Least privilege by job: the build jobs are read-only and run untrusted
# dependency build scripts without persisted git credentials; only the
# publish job can write releases. Release notes are written by hand at
# release time (`gh release edit`): --generate-notes on the first tag lists
# every historical housekeeping PR, which wagged the v0.1.0 notes.
on:
  push:
    tags: ["v*"]
  # Manual dry run. The artifact actions (upload/download) appear only in this
  # workflow, which a tag push is otherwise the only way to reach, so a green
  # ordinary PR proves nothing about them. Dispatching runs the full
  # build -> upload -> download path and skips only the publish step, which
  # would otherwise try to `gh release create` a branch name.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: version
        run: |
          cargo_ver="$(cargo metadata --format-version 1 --no-deps | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")"
          # A tag must match the manifest; a dispatch has no tag, so the
          # manifest is the only honest source and no drift to refuse.
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            test "${GITHUB_REF_NAME#v}" = "$cargo_ver" || \
              { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_ver}"; exit 1; }
          else
            echo "Manual dry run on ${GITHUB_REF_NAME}: building ${cargo_ver}, publish step skipped"
          fi
          echo "version=$cargo_ver" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble tarball
        run: |
          dist="ghostdu-${{ steps.version.outputs.version }}-${{ matrix.arch }}"
          mkdir "$dist"
          cp target/release/ghostdu README.md LICENSE "$dist/"
          "./$dist/ghostdu" --print-manpage > "$dist/ghostdu.1"
          "./$dist/ghostdu" --print-completions bash > "$dist/ghostdu.bash"
          "./$dist/ghostdu" --print-completions zsh > "$dist/_ghostdu"
          "./$dist/ghostdu" --print-completions fish > "$dist/ghostdu.fish"
          # Flat archive (no top-level directory): the -bin PKGBUILD installs
          # with bare paths from $srcdir.
          tar -czf "$dist.tar.gz" -C "$dist" .
          sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256"

      - name: Upload tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarball-${{ matrix.arch }}
          path: |
            ghostdu-*-x86_64.tar.gz
            ghostdu-*-x86_64.tar.gz.sha256
            ghostdu-*-aarch64.tar.gz
            ghostdu-*-aarch64.tar.gz.sha256

  # Proves the upload -> download round trip on every path, including a manual
  # dry run. The publish job below cannot serve as that proof: it is skipped on
  # a dispatch, and a release is the one side effect a dry run must not have.
  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-tarball-*
          merge-multiple: true

      - name: Verify artifact round trip
        shell: bash
        run: |
          # -o pipefail: without it a failing tar is masked by a succeeding
          # sort, and the checksums cannot catch a corrupt archive because they
          # are computed from that same archive.
          set -euo pipefail
          ls -l
          # Both architectures must arrive, each with its checksum file, and the
          # bytes must still match what the build job hashed before upload.
          for arch in x86_64 aarch64; do
            ls "ghostdu-"*"-$arch.tar.gz" "ghostdu-"*"-$arch.tar.gz.sha256"
            sha256sum -c "ghostdu-"*"-$arch.tar.gz.sha256"
            tar -tzf "ghostdu-"*"-$arch.tar.gz" | sort
          done
          # Every archive listed above must also actually extract, so a corrupt
          # aarch64 asset cannot ride along on the x86_64 binary running here.
          for arch in x86_64 aarch64; do
            mkdir -p "unpacked-$arch"
            tar -xzf "ghostdu-"*"-$arch.tar.gz" -C "unpacked-$arch"
          done
          # The x86_64 binary executes on this runner; the tarball is flat, so
          # it sits at the archive root next to its man page and completions.
          ./unpacked-x86_64/ghostdu --version

  publish:
    needs: [build, verify]
    # Only a tag *push* publishes. ref_type alone is not enough: a manual
    # dispatch may target a tag ref, which would pass that gate and create a
    # release during what is meant to be a dry run.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Explicit tag ref: the default resolves the event SHA, which
          # collides with fetch-tags auto-following the annotated tag
          # ("cannot fetch both a commit and a tag pointing to it").
          ref: ${{ github.ref }}
          fetch-tags: true

      - name: Download tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-tarball-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh reads --notes-from-tag from the local repository: checkout
          # above materializes refs/tags/<release>. Notes are the tag
          # annotation; a lightweight tag fails visibly and must be annotated
          # (house invariant: every release tag is annotated).
          #
          # No --repo here: gh rejects `--notes-from-tag` combined with
          # `--repo` ("using --notes-from-tag with --repo is not supported"),
          # and the checkout above already establishes the repository.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --notes-from-tag \
            ghostdu-*.tar.gz ghostdu-*.tar.gz.sha256
