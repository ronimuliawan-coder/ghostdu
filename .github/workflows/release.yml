name: Release

# Tagged pushes (v0.1.0, v0.2.0, ...) build the release binary, bundle it with
# the man page and shell completions generated by the binary itself, and
# publish everything as a GitHub Release. `packaging/ghostdu-bin/PKGBUILD`
# downloads the tarball assembled here, so keep its file list in sync.
#
# Least privilege by job: the build job is read-only and runs untrusted
# dependency build scripts without persisted git credentials; only the
# publish job can write releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse tag/version drift
        run: |
          cargo_ver="$(cargo metadata --format-version 1 --no-deps | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")"
          test "${GITHUB_REF_NAME#v}" = "$cargo_ver" || \
            { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_ver}"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble tarball
        run: |
          dist="ghostdu-${GITHUB_REF_NAME#v}-x86_64"
          mkdir "$dist"
          cp target/release/ghostdu README.md LICENSE "$dist/"
          "./$dist/ghostdu" --print-manpage > "$dist/ghostdu.1"
          "./$dist/ghostdu" --print-completions bash > "$dist/ghostdu.bash"
          "./$dist/ghostdu" --print-completions zsh > "$dist/_ghostdu"
          "./$dist/ghostdu" --print-completions fish > "$dist/ghostdu.fish"
          # Flat archive (no top-level directory): the -bin PKGBUILD installs
          # with bare paths from $srcdir.
          tar -czf "$dist.tar.gz" -C "$dist" .
          sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256"

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: |
            ghostdu-*-x86_64.tar.gz
            ghostdu-*-x86_64.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: release-tarball

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            ghostdu-*-x86_64.tar.gz ghostdu-*-x86_64.tar.gz.sha256
