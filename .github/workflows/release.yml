name: Release

# Tagged pushes (v0.1.0, v0.2.0, ...) build the release binary on x86_64 and
# aarch64 (GitHub's free linux/arm64 hosted runner), bundle each with the man
# page and shell completions generated by the binary itself, and publish
# everything as a GitHub Release. `packaging/ghostdu-bin/PKGBUILD` downloads
# the x86_64 tarball assembled here, so keep its file list in sync.
#
# Least privilege by job: the build jobs are read-only and run untrusted
# dependency build scripts without persisted git credentials; only the
# publish job can write releases. Release notes are written by hand at
# release time (`gh release edit`): --generate-notes on the first tag lists
# every historical housekeeping PR, which wagged the v0.1.0 notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-latest
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Refuse tag/version drift
        run: |
          cargo_ver="$(cargo metadata --format-version 1 --no-deps | python3 -c "import json,sys; print(json.load(sys.stdin)['packages'][0]['version'])")"
          test "${GITHUB_REF_NAME#v}" = "$cargo_ver" || \
            { echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_ver}"; exit 1; }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble tarball
        run: |
          dist="ghostdu-${GITHUB_REF_NAME#v}-${{ matrix.arch }}"
          mkdir "$dist"
          cp target/release/ghostdu README.md LICENSE "$dist/"
          "./$dist/ghostdu" --print-manpage > "$dist/ghostdu.1"
          "./$dist/ghostdu" --print-completions bash > "$dist/ghostdu.bash"
          "./$dist/ghostdu" --print-completions zsh > "$dist/_ghostdu"
          "./$dist/ghostdu" --print-completions fish > "$dist/ghostdu.fish"
          # Flat archive (no top-level directory): the -bin PKGBUILD installs
          # with bare paths from $srcdir.
          tar -czf "$dist.tar.gz" -C "$dist" .
          sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256"

      - name: Upload tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-tarball-${{ matrix.arch }}
          path: |
            ghostdu-*-x86_64.tar.gz
            ghostdu-*-x86_64.tar.gz.sha256
            ghostdu-*-aarch64.tar.gz
            ghostdu-*-aarch64.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # Explicit tag ref: the default resolves the event SHA, which
          # collides with fetch-tags auto-following the annotated tag
          # ("cannot fetch both a commit and a tag pointing to it").
          ref: ${{ github.ref }}
          fetch-tags: true

      - name: Download tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-tarball-*
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh reads --notes-from-tag from the local repository: checkout
          # above materializes refs/tags/<release>. Notes are the tag
          # annotation; a lightweight tag fails visibly and must be annotated
          # (house invariant: every release tag is annotated).
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-from-tag \
            ghostdu-*.tar.gz ghostdu-*.tar.gz.sha256
