name: Release

# Tagged pushes (v0.1.0, v0.2.0, ...) build the release binary, bundle it with
# the man page and shell completions generated by the binary itself, and
# publish everything as a GitHub Release. `packaging/ghostdu-bin/PKGBUILD`
# downloads the tarball assembled here, so keep its file list in sync.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse tag/version drift
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble tarball
        run: |
          dist="ghostdu-${GITHUB_REF_NAME#v}-x86_64"
          mkdir "$dist"
          cp target/release/ghostdu README.md LICENSE "$dist/"
          "./$dist/ghostdu" --print-manpage > "$dist/ghostdu.1"
          "./$dist/ghostdu" --print-completions bash > "$dist/ghostdu.bash"
          "./$dist/ghostdu" --print-completions zsh > "$dist/_ghostdu"
          "./$dist/ghostdu" --print-completions fish > "$dist/ghostdu.fish"
          tar -czf "$dist.tar.gz" "$dist"
          sha256sum "$dist.tar.gz" > "$dist.tar.gz.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dist="ghostdu-${GITHUB_REF_NAME#v}-x86_64"
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            "$dist.tar.gz" "$dist.tar.gz.sha256"
