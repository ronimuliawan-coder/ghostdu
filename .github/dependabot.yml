version: 2

updates:
  # Cargo dependencies. Grouped so a routine patch wave is one PR rather than
  # a stream of them; a major bump still arrives on its own because it needs
  # a compatibility decision.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # No `ignore` entry for the toolchain: the Cargo ecosystem cannot see it.
    # `rust-toolchain.toml` is not a Cargo manifest and there is no crate named
    # "rust", so an ignore rule here would be inert while implying the pin is
    # protected. Toolchain upgrades stay a deliberate change with gate evidence
    # (a stable bump once broke a green revision: clippy 1.100 needless_bool).

  # GitHub Actions. These are pinned by commit SHA in the workflows; Dependabot
  # updates both the SHA and its trailing version comment.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
