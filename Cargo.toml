[package]
name = "ghostdu"
version = "0.1.0"
edition = "2021"
authors = ["Ron"]
description = "Modern, ultra-fast native Linux disk usage & ghost file analyzer with wastebin support"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rayon = "1.10"
walkdir = "2.5"
trash = "5.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
