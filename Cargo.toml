[package]
name = "ghostdu"
version = "0.1.1"
edition = "2021"
# Minimum supported Rust version. Declared as the toolchain CI actually builds
# and tests against (rust-toolchain.toml), not a guessed older floor: an MSRV
# nobody tests is a promise the project cannot keep.
rust-version = "1.99.1"
authors = ["Roni Muliawan <ronimuliawan12@gmail.com>"]
license = "MIT"
description = "Modern, native Linux disk usage & ghost file analyzer with wastebin support"
repository = "https://github.com/ronimuliawan-coder/ghostdu"
homepage = "https://github.com/ronimuliawan-coder/ghostdu"
readme = "README.md"
keywords = ["disk-usage", "ncdu", "tui", "docker", "du"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = "0.30"
crossterm = "0.29"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
rustix = { version = "1.1", features = ["fs", "process"] }
crossbeam-channel = "0.5"
unicode-width = "0.2"
unicode-segmentation = "1.13"
clap_complete = "4.6.11"
clap_mangen = "0.3.3"

[dev-dependencies]
tempfile = "3.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tarpaulin_include)"] }
